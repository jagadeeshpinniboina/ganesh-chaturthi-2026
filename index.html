<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ganesh Chaturthi 2026 | A Divine Blessing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="experience">

        <!-- Main cinematic scene -->
        <div id="scene">

            <!-- Divine light -->
            <div id="divineLight"></div>

            <!-- Expanding golden energy ring -->
            <div id="energyRing"></div>

            <!-- Floating golden particles -->
            <div id="particles"></div>

            <!-- Lotus -->
            <div id="lotus">
                <div class="lotus-petal petal-1"></div>
                <div class="lotus-petal petal-2"></div>
                <div class="lotus-petal petal-3"></div>
                <div class="lotus-petal petal-4"></div>
                <div class="lotus-petal petal-5"></div>
                <div class="lotus-petal petal-6"></div>
                <div class="lotus-petal petal-7"></div>
                <div class="lotus-petal petal-8"></div>
                <div class="lotus-center"></div>
            </div>

            <!-- Golden seat -->
            <div id="goldenSeat"></div>

            <!-- Ganesha image -->
            <div id="ganeshaContainer">

                <img
                    id="ganeshaImage"
                    src="ganesha.png"
                    alt="Lord Ganesha"
                >

            </div>

            <!-- Left diya -->
            <div id="leftDiya" class="diya">

                <div class="diya-flame"></div>

                <div class="diya-bowl"></div>

                <div class="diya-glow"></div>

            </div>

            <!-- Right diya -->
            <div id="rightDiya" class="diya">

                <div class="diya-flame"></div>

                <div class="diya-bowl"></div>

                <div class="diya-glow"></div>

            </div>

            <!-- Divine aura -->
            <div id="divineAura"></div>

        </div>


        <!-- Stage description -->
        <div id="stageText"></div>


        <!-- Final blessing -->
        <section id="finalMessage">

            <div class="messageContent">

                <div class="sanskrit">
                    ॐ श्री गणेशाय नमः
                </div>

                <h1>
                    Happy Ganesh Chaturthi
                </h1>

                <h2>
                    వినాయక చవితి శుభాకాంక్షలు
                </h2>

                <p>
                    May Lord Ganesha remove all obstacles
                    and fill your life with happiness,
                    wisdom and success.
                </p>

                <div class="blessing">
                    🌺 A Divine Blessing 🌺
                </div>

                <div class="always">
                    Always with You...
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
