<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesh Chaturthi 2026 | A Divine Blessing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="experience">

    <div id="scene">

        <!-- Divine atmosphere -->
        <div id="divineLight"></div>
        <div id="energyRing"></div>
        <div id="particles"></div>

        <!-- Single Ganesha image -->
        <div id="ganeshaReveal">

            <img
                id="ganeshaImage"
                src="ganesha.png"
                alt="Lord Ganesha"
            >

        </div>

        <!-- Golden aura -->
        <div id="aura"></div>

        <!-- Timeline text -->
        <div id="stageText"></div>

    </div>

    <!-- Final blessing -->
    <section id="finalMessage">

        <div class="messageContent">

            <div class="sanskrit">
                ॐ श्री गणेशाय नमः
            </div>

            <h1>
                Happy Ganesh Chaturthi
            </h1>

            <h2>
                వినాయక చవితి శుభాకాంక్షలు
            </h2>

            <p>
                May Lord Ganesha remove all obstacles
                and fill your life with happiness,
                wisdom and success.
            </p>

            <div class="flowerLine">
                🌺 A Divine Blessing 🌺
            </div>

            <div class="always">
                Always with You...
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
