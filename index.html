<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesh Chaturthi 2026 | A Divine Blessing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="experience">

    <!-- BLACK BACKGROUND -->
    <div class="background"></div>

    <!-- PARTICLES -->
    <img id="particles" src="./particles.png" alt="">

    <!-- DIVINE LIGHT -->
    <img id="divineLight" src="./divine-light.png" alt="">
    <img id="lightExpand" src="./light-expand.png" alt="">

    <!-- LOTUS -->
    <div id="lotusStage">

        <img id="lotusCenter"
             src="./lotus-center.png"
             alt="">

        <img id="lotusOpening"
             src="./lotus-opening.png"
             alt="">

        <img id="lotusFull"
             src="./lotus-full.png"
             alt="">

    </div>

    <!-- GOLDEN SEAT -->
    <img id="goldenSeat"
         src="./lotus-seat.png"
         alt="">

    <!-- GANESHA -->
    <div id="ganeshaReveal">

        <img id="ganeshaBase"
             src="./ganesha-complete.png"
             alt="">

        <div class="reveal crown">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal eyes">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal ears">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal trunk">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal face">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal left-hand">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal right-hand">
            <img src="./ganesha-complete.png" alt="">
        </div>

        <div class="reveal ornaments">
            <img src="./ganesha-complete.png" alt="">
        </div>

    </div>

    <!-- DIYAS -->
    <img id="leftDiya"
         src="./diya-left.png"
         alt="">

    <img id="rightDiya"
         src="./diya-right.png"
         alt="">

    <!-- FINAL WISH -->
    <section id="wish">

        <div class="om">ॐ</div>

        <h1>Happy Ganesh Chaturthi</h1>

        <h2>వినాయక చవితి శుభాకాంక్షలు</h2>

        <p>
            May Lord Ganesha remove all obstacles
            and fill your life with happiness,
            wisdom and success.
        </p>

    </section>

    <!-- FINAL BLESSING -->
    <section id="blessing">

        <div>|| श्री गणेशाय नमः ||</div>

        <h1>A Divine Blessing</h1>

        <p>Always with You...</p>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
