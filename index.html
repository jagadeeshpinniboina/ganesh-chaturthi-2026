<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesh Chaturthi 2026 | A Divine Blessing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="experience">

        <!-- =========================================
             CINEMATIC BACKGROUND
        ========================================== -->

        <div class="black-background"></div>

        <div id="goldenParticles"></div>

        <div id="divineGlow"></div>


        <!-- =========================================
             DIVINE LIGHT
        ========================================== -->

        <div id="lightStage">

            <img
                id="divineLight"
                src="./divine-light.png"
                alt=""
            >

            <img
                id="lightExpand"
                src="./light-expand.png"
                alt=""
            >

            <img
                id="particleImage"
                src="./particles.png"
                alt=""
            >

        </div>


        <!-- =========================================
             LOTUS
        ========================================== -->

        <div id="lotusStage">

            <img
                id="lotusCenter"
                class="lotusImage"
                src="./lotus-center.png"
                alt=""
            >

            <img
                id="lotusOpening"
                class="lotusImage"
                src="./lotus-opening.png"
                alt=""
            >

            <img
                id="lotusFull"
                class="lotusImage"
                src="./lotus-full.png"
                alt=""
            >

        </div>


        <!-- =========================================
             GOLDEN SEAT
        ========================================== -->

        <img
            id="goldenSeat"
            src="./lotus-seat.png"
            alt=""
        >


        <!-- =========================================
             GANESHA
        ========================================== -->

        <div id="ganeshaStage">

            <img
                id="ganeshaCrown"
                class="ganeshaPart"
                src="./ganesha-crown.png"
                alt=""
            >

            <img
                id="ganeshaEyes"
                class="ganeshaPart"
                src="./ganesha-eyes.png"
                alt=""
            >

            <img
                id="ganeshaEars"
                class="ganeshaPart"
                src="./ganesha-ears.png"
                alt=""
            >

            <img
                id="ganeshaTrunk"
                class="ganeshaPart"
                src="./ganesha-trunk.png"
                alt=""
            >

            <img
                id="ganeshaFace"
                class="ganeshaPart"
                src="./ganesha-face.png"
                alt=""
            >

            <img
                id="ganeshaLeftHand"
                class="ganeshaPart"
                src="./ganesha-left-hand.png"
                alt=""
            >

            <img
                id="ganeshaRightHand"
                class="ganeshaPart"
                src="./ganesha-right-hand.png"
                alt=""
            >

            <img
                id="ganeshaOrnaments"
                class="ganeshaPart"
                src="./ganesha-ornaments.png"
                alt=""
            >

            <img
                id="ganeshaComplete"
                class="ganeshaPart"
                src="./ganesha-complete.png"
                alt=""
            >

        </div>


        <!-- =========================================
             DIYAS
        ========================================== -->

        <img
            id="leftDiya"
            class="diya"
            src="./diya-left.png"
            alt=""
        >

        <img
            id="rightDiya"
            class="diya"
            src="./diya-right.png"
            alt=""
        >


        <!-- =========================================
             STAGE TITLE
        ========================================== -->

        <div id="stageText"></div>


        <!-- =========================================
             FINAL WISH
        ========================================== -->

        <section id="finalWish">

            <div class="wishOm">
                ॐ
            </div>

            <h1>
                Happy Ganesh Chaturthi
            </h1>

            <h2>
                వినాయక చవితి శుభాకాంక్షలు
            </h2>

            <p>
                May Lord Ganesha remove all obstacles
                and fill your life with happiness,
                wisdom and success.
            </p>

            <div class="wishLine">
                ✦ 🙏 ✦
            </div>

        </section>


        <!-- =========================================
             FINAL BLESSING
        ========================================== -->

        <section id="finalBlessing">

            <div>
                || श्री गणेशाय नमः ||
            </div>

            <h1>
                A Divine Blessing
            </h1>

            <p>
                Always with You...
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
