<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Ganesh Chaturthi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="scene">

        <!-- =========================================
             BLACK BACKGROUND
        ========================================== -->
        <div class="background"></div>


        <!-- =========================================
             DIVINE LIGHT
             2–6 seconds
        ========================================== -->
        <img
            id="divineLight"
            src="./divine-light.png"
            alt=""
        >

        <img
            id="lightExpand"
            src="./light-expand.png"
            alt=""
        >

        <img
            id="particles"
            src="./particles.png"
            alt=""
        >


        <!-- =========================================
             LOTUS
             6–14 seconds
        ========================================== -->
        <div id="lotusStage">

            <img
                id="lotusCenter"
                src="./lotus-center.png"
                alt=""
            >

            <img
                id="lotusOpening"
                src="./lotus-opening.png"
                alt=""
            >

            <img
                id="lotusFull"
                src="./lotus-full.png"
                alt=""
            >

            <img
                id="lotusSeat"
                src="./lotus-seat.png"
                alt=""
            >

        </div>


        <!-- =========================================
             GANESHA REVEAL
             14–30 seconds

             Original Stage-by-Stage Idea
             NO DRAWING EFFECT
        ========================================== -->
        <div id="ganeshaStage">

            <!-- 14–16s : Crown -->
            <img
                id="ganeshaCrown"
                class="ganeshaPart"
                src="./ganesha-crown.png"
                alt=""
            >

            <!-- 16–18s : Eyes -->
            <img
                id="ganeshaEyes"
                class="ganeshaPart"
                src="./ganesha-eyes.png"
                alt=""
            >

            <!-- 18–20s : Ears -->
            <img
                id="ganeshaEars"
                class="ganeshaPart"
                src="./ganesha-ears.png"
                alt=""
            >

            <!-- 20–22s : Trunk -->
            <img
                id="ganeshaTrunk"
                class="ganeshaPart"
                src="./ganesha-trunk.png"
                alt=""
            >

            <!-- 22–24s : Face -->
            <img
                id="ganeshaFace"
                class="ganeshaPart"
                src="./ganesha-face.png"
                alt=""
            >

            <!-- 24–26s : Left Hand -->
            <img
                id="ganeshaLeftHand"
                class="ganeshaPart"
                src="./ganesha-left-hand.png"
                alt=""
            >

            <!-- 24–26s : Right Hand -->
            <img
                id="ganeshaRightHand"
                class="ganeshaPart"
                src="./ganesha-right-hand.png"
                alt=""
            >

            <!-- 26–28s : Ornaments + Clothing -->
            <img
                id="ganeshaOrnaments"
                class="ganeshaPart"
                src="./ganesha-ornaments.png"
                alt=""
            >

            <!-- 28–30s : Complete Ganesha -->
            <img
                id="ganeshaComplete"
                class="ganeshaPart"
                src="./ganesha-complete.png"
                alt="Lord Ganesha"
            >

        </div>


        <!-- =========================================
             DIYAS
             32–34 seconds
        ========================================== -->

        <img
            id="diyaLeft"
            src="./diya-left.png"
            alt=""
        >

        <img
            id="diyaRight"
            src="./diya-right.png"
            alt=""
        >


        <!-- =========================================
             FINAL WISH
             34–36 seconds
        ========================================== -->

        <section id="wish">

            <h1>
                Happy Ganesh Chaturthi
            </h1>

            <h2>
                వినాయక చవితి శుభాకాంక్షలు
            </h2>

            <p>
                May Lord Ganesha remove all obstacles
                and fill your life with happiness,
                wisdom and success.
            </p>

        </section>


        <!-- =========================================
             FINAL BLESSING
             36+ seconds
        ========================================== -->

        <section id="blessing">

            <div>
                || श्री गणेशाय नमः ||
            </div>

            <strong>
                A Divine Blessing
            </strong>

            <span>
                Always with You...
            </span>

        </section>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
