<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganesh Chaturthi 2026 | A Divine Blessing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="experience">

        <canvas id="ganeshCanvas"></canvas>

        <!-- Cinematic overlay -->
        <div id="cinematicGlow"></div>

        <!-- Timeline indicator -->
        <div id="sceneTime">00:00</div>

        <!-- Final blessing -->
        <section id="finalMessage">

            <div class="message-inner">

                <div class="om">ॐ श्री गणेशाय नमः</div>

                <h1>Happy Ganesh Chaturthi</h1>

                <h2>వినాయక చవితి శుభాకాంక్షలు</h2>

                <p>
                    May Lord Ganesha remove all obstacles
                    and fill your life with happiness,
                    wisdom and success.
                </p>

                <div class="blessing-line">
                    🌺 A Divine Blessing 🌺
                </div>

                <div class="always">
                    Always with You...
                </div>

            </div>

        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
